name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # /nlp/planning is the instructor-only schedule view. It is reachable
      # locally via `npm run dev`, but must never reach the published site —
      # static hosting cannot password-protect it. Next.js has no dev-only
      # route, so it is stripped from the export here and the deploy fails if
      # anything is left behind.
      - name: Strip instructor-only pages from the build output
        run: |
          rm -rf out/nlp/planning out/nlp/planning.html out/nlp/planning.txt
          leftover=$(find out -path '*planning*' -print -quit)
          if [ -n "$leftover" ]; then
            echo "::error::instructor-only page still present in build output: $leftover"
            exit 1
          fi
          echo "Verified: no /nlp/planning files in the deploy artifact."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
